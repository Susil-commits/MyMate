name: Backend CI (Go)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Build & Test Golang Backend
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v -race -coverprofile=coverage.txt ./...
        env:
          APP_ENV: test
          JWT_SECRET: ci_github_actions_mock_jwt_secret_12345
          DISABLE_REDIS: "true"

      - name: Build Binary
        run: go build -v -o server main.go
